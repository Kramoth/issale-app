<ion-content>
  <div class="page">
    <h2>
      <span></span>
      Circle
      <span></span>
    </h2>
  </div>
  <ion-button (click)="isModalOpen = true">Configurer</ion-button>
  <ion-modal [isOpen]="isModalOpen">
    <ng-template>
      <ion-content>
        <p>Configuration (à venir)</p>
        <ion-input type="number" [(ngModel)]="target" label="Objectif"></ion-input>
        <ion-input type="number" [(ngModel)]="step" label="Palier"></ion-input>
        <ion-button (click)="valider()">Valider</ion-button>
        <ion-button (click)="isModalOpen = false">Fermer</ion-button>
      </ion-content>
    </ng-template>
  </ion-modal>
  <p>Objectif: {{target}}</p>
  <p>Restant: {{restant()}}</p>
  @for(elm of steps; track $index)
  {
  <ion-button [fill]="elm.coche ? 'solid' : 'outline'" (click)="tick(elm)">{{step}}</ion-button>
  }
  @if(remainder > 0)
  {
  <ion-button color="tertiary" [fill]="remainderTick ? 'solid' : 'outline'" (click)="remainderTick = !remainderTick">{{ remainder }}</ion-button>
  }
</ion-content>
