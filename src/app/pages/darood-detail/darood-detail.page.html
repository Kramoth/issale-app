<ion-content>
  @if(darood$ | async; as darood)
  {
    <div class="page">
      <h2>
        <span></span>
        {{darood.nom}}
        <span></span>
      </h2>
    </div>
    @for (verset of darood.versets; track $index) {
      <p dir="rtl">{{ verset.arabe }}</p>
      <p class="transliteration">{{ verset.translitteration }}</p>
      <p>{{ verset.traduction }}</p>
    }
  }
</ion-content>
